<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 14px;
      color: #24292f;
    }

    h2 {
      margin: 0 0 4px 0;
      font-size: 16px;
    }

    .subtitle {
      color: #656d76;
      font-size: 12px;
      margin: 0 0 14px 0;
    }

    .severity-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #d0d7de;
    }

    .severity-row:last-child {
      border-bottom: none;
    }

    .severity-label {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .severity-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
      color: #fff;
    }

    .badge-nitpick { background-color: #818b98; }
    .badge-suggestion { background-color: #0969da; }
    .badge-warning { background-color: #bf8700; }
    .badge-issue { background-color: #cf222e; }

    .toggle {
      position: relative;
      width: 40px;
      height: 22px;
      flex-shrink: 0;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #d0d7de;
      border-radius: 22px;
      transition: background-color 0.2s;
    }

    .slider::before {
      content: "";
      position: absolute;
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .toggle input:checked + .slider {
      background-color: #1a7f37;
    }

    .toggle input:checked + .slider::before {
      transform: translateX(18px);
    }

    .hidden-count {
      margin-top: 12px;
      padding: 8px;
      background: #f6f8fa;
      border-radius: 6px;
      font-size: 12px;
      color: #656d76;
      text-align: center;
    }
  </style>
</head>
<body>
  <h2>CodeRabbit Filter</h2>
  <p class="subtitle">Toggle comment visibility by severity</p>

  <div class="severity-row">
    <span class="severity-label">
      <span class="severity-badge badge-nitpick">nitpick</span>
    </span>
    <label class="toggle">
      <input type="checkbox" data-severity="nitpick" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="severity-row">
    <span class="severity-label">
      <span class="severity-badge badge-suggestion">suggestion</span>
    </span>
    <label class="toggle">
      <input type="checkbox" data-severity="suggestion" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="severity-row">
    <span class="severity-label">
      <span class="severity-badge badge-warning">warning</span>
    </span>
    <label class="toggle">
      <input type="checkbox" data-severity="warning" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="severity-row">
    <span class="severity-label">
      <span class="severity-badge badge-issue">issue</span>
    </span>
    <label class="toggle">
      <input type="checkbox" data-severity="issue" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="hidden-count" id="hiddenCount"></div>

  <script src="popup.js"></script>
</body>
</html>
