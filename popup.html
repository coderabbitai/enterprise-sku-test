<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 14px;
      color: #24292f;
    }

    h2 {
      margin: 0 0 4px 0;
      font-size: 16px;
    }

    .subtitle {
      color: #656d76;
      font-size: 12px;
      margin: 0 0 14px 0;
    }

    /* Search bar */
    .search-container {
      margin-bottom: 12px;
    }

    .search-input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }

    .search-input:focus {
      border-color: #0969da;
      box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.15);
    }

    .search-input::placeholder {
      color: #8c959f;
    }

    .search-hint {
      font-size: 11px;
      color: #8c959f;
      margin-top: 4px;
    }

    /* Severity rows */
    .severity-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #d0d7de;
    }

    .severity-row:last-of-type {
      border-bottom: none;
    }

    .severity-label {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .severity-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
      color: #fff;
    }

    .badge-nitpick { background-color: #818b98; }
    .badge-suggestion { background-color: #0969da; }
    .badge-warning { background-color: #bf8700; }
    .badge-issue { background-color: #cf222e; }

    .severity-count {
      font-size: 11px;
      font-weight: 600;
      color: #656d76;
      background: #eaeef2;
      padding: 1px 7px;
      border-radius: 10px;
      min-width: 18px;
      text-align: center;
    }

    .severity-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toggle {
      position: relative;
      width: 40px;
      height: 22px;
      flex-shrink: 0;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #d0d7de;
      border-radius: 22px;
      transition: background-color 0.2s;
    }

    .slider::before {
      content: "";
      position: absolute;
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .toggle input:checked + .slider {
      background-color: #1a7f37;
    }

    .toggle input:checked + .slider::before {
      transform: translateX(18px);
    }

    .hidden-count {
      margin-top: 12px;
      padding: 8px;
      background: #f6f8fa;
      border-radius: 6px;
      font-size: 12px;
      color: #656d76;
      text-align: center;
    }

    /* Export section */
    .export-section {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #d0d7de;
    }

    .export-label {
      font-size: 12px;
      font-weight: 600;
      color: #656d76;
      margin-bottom: 8px;
    }

    .export-buttons {
      display: flex;
      gap: 6px;
    }

    .export-btn {
      flex: 1;
      padding: 6px 0;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      background: #fff;
      font-size: 12px;
      font-family: inherit;
      color: #24292f;
      cursor: pointer;
      transition: background 0.15s;
      text-align: center;
    }

    .export-btn:hover {
      background: #f6f8fa;
    }

    .export-btn:active {
      background: #eaeef2;
    }

    /* Summary widget toggle */
    .widget-row {
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
    }

    .widget-label {
      font-size: 12px;
      color: #656d76;
    }

    /* Quick actions */
    .quick-actions {
      margin-top: 10px;
      display: flex;
      gap: 6px;
    }

    .quick-btn {
      flex: 1;
      padding: 6px 0;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      background: #f6f8fa;
      font-size: 11px;
      font-family: inherit;
      color: #24292f;
      cursor: pointer;
      transition: background 0.15s;
      text-align: center;
    }

    .quick-btn:hover { background: #eaeef2; }
  </style>
</head>
<body>
  <h2>CodeRabbit Filter</h2>
  <p class="subtitle">Filter, search, and export comments by severity</p>

  <!-- Search bar -->
  <div class="search-container">
    <input type="text" class="search-input" id="searchInput" placeholder="Search within comments...">
    <div class="search-hint" id="searchHint"></div>
  </div>

  <!-- Severity toggles with counts -->
  <div class="severity-row">
    <span class="severity-label">
      <span class="severity-badge badge-nitpick">nitpick</span>
    </span>
    <span class="severity-right">
      <span class="severity-count" id="count-nitpick">0</span>
      <label class="toggle">
        <input type="checkbox" data-severity="nitpick" checked>
        <span class="slider"></span>
      </label>
    </span>
  </div>

  <div class="severity-row">
    <span class="severity-label">
      <span class="severity-badge badge-suggestion">suggestion</span>
    </span>
    <span class="severity-right">
      <span class="severity-count" id="count-suggestion">0</span>
      <label class="toggle">
        <input type="checkbox" data-severity="suggestion" checked>
        <span class="slider"></span>
      </label>
    </span>
  </div>

  <div class="severity-row">
    <span class="severity-label">
      <span class="severity-badge badge-warning">warning</span>
    </span>
    <span class="severity-right">
      <span class="severity-count" id="count-warning">0</span>
      <label class="toggle">
        <input type="checkbox" data-severity="warning" checked>
        <span class="slider"></span>
      </label>
    </span>
  </div>

  <div class="severity-row">
    <span class="severity-label">
      <span class="severity-badge badge-issue">issue</span>
    </span>
    <span class="severity-right">
      <span class="severity-count" id="count-issue">0</span>
      <label class="toggle">
        <input type="checkbox" data-severity="issue" checked>
        <span class="slider"></span>
      </label>
    </span>
  </div>

  <div class="hidden-count" id="hiddenCount"></div>

  <!-- Quick actions -->
  <div class="quick-actions">
    <button class="quick-btn" id="showAll">Show All</button>
    <button class="quick-btn" id="hideAll">Hide All</button>
    <button class="quick-btn" id="issuesOnly">Issues Only</button>
  </div>

  <!-- Widget toggle -->
  <div class="widget-row">
    <span class="widget-label">Show floating summary on page</span>
    <label class="toggle">
      <input type="checkbox" id="widgetToggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <!-- Export section -->
  <div class="export-section">
    <div class="export-label">Export visible comments</div>
    <div class="export-buttons">
      <button class="export-btn" data-format="markdown">Markdown</button>
      <button class="export-btn" data-format="json">JSON</button>
      <button class="export-btn" data-format="csv">CSV</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
