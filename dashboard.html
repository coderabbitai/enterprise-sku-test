<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CodeRabbit Filter — Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      color: #24292f;
      background: #f6f8fa;
      padding: 32px;
      max-width: 960px;
      margin: 0 auto;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 4px;
    }

    .header-subtitle {
      color: #656d76;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: #fff;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 700;
      line-height: 1.2;
    }

    .stat-label {
      font-size: 12px;
      color: #656d76;
      margin-top: 4px;
    }

    .stat-card.nitpick .stat-value { color: #818b98; }
    .stat-card.suggestion .stat-value { color: #0969da; }
    .stat-card.warning .stat-value { color: #bf8700; }
    .stat-card.issue .stat-value { color: #cf222e; }

    .card {
      background: #fff;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .card h2 {
      font-size: 16px;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid #d0d7de;
    }

    /* Bar chart */
    .bar-chart {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .bar-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .bar-label {
      width: 100px;
      font-size: 13px;
      font-weight: 500;
      text-align: right;
      flex-shrink: 0;
    }

    .bar-track {
      flex: 1;
      height: 28px;
      background: #eaeef2;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }

    .bar-fill {
      height: 100%;
      border-radius: 6px;
      transition: width 0.4s ease;
      min-width: 2px;
    }

    .bar-fill.nitpick { background: #818b98; }
    .bar-fill.suggestion { background: #0969da; }
    .bar-fill.warning { background: #bf8700; }
    .bar-fill.issue { background: #cf222e; }

    .bar-count {
      width: 50px;
      font-size: 13px;
      color: #656d76;
      flex-shrink: 0;
    }

    /* Pie chart (CSS only) */
    .pie-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 32px;
    }

    .pie {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      position: relative;
    }

    .pie-legend {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .legend-dot.nitpick { background: #818b98; }
    .legend-dot.suggestion { background: #0969da; }
    .legend-dot.warning { background: #bf8700; }
    .legend-dot.issue { background: #cf222e; }

    /* Repo table */
    .repo-table {
      width: 100%;
      border-collapse: collapse;
    }

    .repo-table th {
      text-align: left;
      font-size: 12px;
      color: #656d76;
      padding: 8px 12px;
      border-bottom: 2px solid #d0d7de;
      font-weight: 600;
    }

    .repo-table td {
      padding: 10px 12px;
      border-bottom: 1px solid #eaeef2;
      font-size: 13px;
    }

    .repo-table tr:last-child td { border-bottom: none; }

    .repo-table .repo-name {
      font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
      font-weight: 500;
    }

    .repo-table .num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .mini-bar {
      display: inline-block;
      height: 6px;
      border-radius: 3px;
      vertical-align: middle;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: #656d76;
    }

    .empty-state p {
      font-size: 14px;
      margin-top: 8px;
    }

    .actions-bar {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 16px;
    }

    .btn {
      padding: 8px 16px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      background: #fff;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn:hover { background: #f6f8fa; }

    .btn-danger {
      color: #cf222e;
      border-color: #cf222e;
    }

    .btn-danger:hover { background: #fff1f0; }

    .last-updated {
      font-size: 12px;
      color: #656d76;
      text-align: right;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <h1>CodeRabbit Filter Dashboard</h1>
  <p class="header-subtitle">Overview of CodeRabbit review comment activity across your repositories</p>

  <div class="actions-bar">
    <button class="btn" id="refreshBtn">Refresh</button>
    <button class="btn" id="exportBtn">Export JSON</button>
    <button class="btn btn-danger" id="resetBtn">Reset</button>
  </div>

  <!-- Summary Cards -->
  <div class="stats-grid" id="statsGrid">
    <div class="stat-card">
      <div class="stat-value" id="totalScanned">0</div>
      <div class="stat-label">Total Comments Scanned</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="totalHidden">0</div>
      <div class="stat-label">Total Comments Hidden</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="repoCount">0</div>
      <div class="stat-label">Repositories</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="filterRate">0%</div>
      <div class="stat-label">Filter Rate</div>
    </div>
  </div>

  <!-- Severity Breakdown -->
  <div class="card">
    <h2>Comments by Severity</h2>
    <div class="pie-container">
      <div class="pie" id="pieChart"></div>
      <div class="pie-legend" id="pieLegend"></div>
    </div>
  </div>

  <!-- Bar Chart -->
  <div class="card">
    <h2>Severity Distribution</h2>
    <div class="bar-chart" id="barChart"></div>
  </div>

  <!-- Repo Breakdown -->
  <div class="card">
    <h2>Per-Repository Breakdown</h2>
    <div id="repoSection"></div>
  </div>

  <div class="last-updated" id="lastUpdated"></div>

  <script src="dashboard.js"></script>
</body>
</html>
